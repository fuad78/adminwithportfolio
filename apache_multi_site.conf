# =========================================================================
# PRODUCTION APACHE 2 CONFIGURATION FOR MULTI-SITE DEPLOYMENTS ON ONE SERVER
# =========================================================================
# Domain: fuadcloud.xyz / www.fuadcloud.xyz
# Target file path: /etc/apache2/sites-available/fuadcloud.conf
#
# Enable via a2ensite: sudo a2ensite fuadcloud.conf
# Verify configuration: sudo apache2ctl configtest
# Reload Apache: sudo systemctl reload apache2
#
# Ports warning: Ports 4001 and 5000 are in use by other services and are avoided.
# Docker Web App is mapped to Port 8080.
# =========================================================================

<VirtualHost *:80>
    ServerName fuadcloud.xyz
    ServerAlias www.fuadcloud.xyz

    # Preserve the original Host header when forwarding requests
    ProxyPreserveHost On

    # Enable HTTP rewrite engine for redirecting (Handled automatically by Certbot later)
    RewriteEngine On

    # Reverse Proxy requests to the Docker container listening on port 8080
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Custom Logging
    ErrorLog ${APACHE_LOG_DIR}/fuadcloud_error.log
    CustomLog ${APACHE_LOG_DIR}/fuadcloud_access.log combined
</VirtualHost>
