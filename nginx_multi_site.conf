# =========================================================================
# PRODUCTION NGINX CONFIGURATION FOR MULTI-SITE DEPLOYMENTS ON ONE SERVER
# =========================================================================
# Domain: fuadcloud.xyz / www.fuadcloud.xyz
# Target file path: /etc/nginx/sites-available/fuadcloud.conf
# Enable via symlink: ln -s /etc/nginx/sites-available/fuadcloud.conf /etc/nginx/sites-enabled/
# Verify config: nginx -t
# Reload config: systemctl reload nginx
#
# Ports warning: Ports 4001 and 5000 are in use by other services and are avoided here.
# =========================================================================

# -------------------------------------------------------------------------
# SITE 1: Portfolio Website (Reverse Proxying to Docker Port 8080)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    
    # User Domain Name
    server_name fuadcloud.xyz www.fuadcloud.xyz;

    # Certbot SSL validation path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS (Uncomment after Certbot setup)
    # return 301 https://$host$request_uri;

    # Proxy traffic to the portfolio Docker container running on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # Standard proxy headers for preserving source details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer and timeout tunings
        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Separate logging for easy debugging and traffic analysis
    access_log /var/log/nginx/fuadcloud_access.log;
    error_log /var/log/nginx/fuadcloud_error.log warn;
}

