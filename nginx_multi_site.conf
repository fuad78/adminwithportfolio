# -------------------------------------------------------------------------
# SITE 2: Example of another local site hosted directly under /var/www/html/another_site
# (Uses standard PHP-FPM processing instead of Docker proxying)
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    
    server_name anotherdomain.com www.anotherdomain.com;
    
    # Root directory on the server
    root /var/www/html/another_site;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM socket)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Adjust PHP-FPM version according to your server (e.g. php8.1-fpm or php8.2-fpm)
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    access_log /var/log/nginx/another_site_access.log;
    error_log /var/log/nginx/another_site_error.log warn;
}
